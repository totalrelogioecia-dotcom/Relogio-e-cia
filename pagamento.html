<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pagamento — Relógio e Cia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand-mark">
        <span class="sq"></span>
        <span class="word">Relógio e Cia<small>Relojoaria desde 2003</small></span>
      </a>
      <a href="produtos.html" class="nav-cta">Continuar comprando</a>
    </nav>
  </header>

  <main style="max-width:760px;margin:80px auto;padding:0 28px">
    <div class="account-box" id="resultado">
      <p class="eyebrow">Pagamento</p>
      <h1 id="titulo">Confirmando seu pagamento…</h1>
      <p id="texto">Estamos confirmando a operação com o Mercado Pago. Aguarde alguns segundos.</p>

      <div id="acoes" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;">
        <a class="btn btn-primary" id="btn-principal" href="index.html">Voltar para a loja</a>
      </div>
    </div>
  </main>

  <script>
  (async () => {
    const q = new URLSearchParams(location.search);
    const retorno = q.get('status');
    const id = q.get('pedido');
    const titulo = document.getElementById('titulo');
    const texto = document.getElementById('texto');
    const acoes = document.getElementById('acoes');
    const btnPrincipal = document.getElementById('btn-principal');

    function mensagemRecusa(statusDetail) {
      const mensagens = {
        cc_rejected_high_risk: 'O pagamento não pôde ser aprovado pela análise de segurança. Tente outro cartão ou outra forma de pagamento.',
        cc_rejected_insufficient_amount: 'O cartão não possui limite suficiente para concluir esta compra. Tente outro cartão ou outra forma de pagamento.',
        cc_rejected_bad_filled_security_code: 'O código de segurança do cartão não foi aceito. Confira os dados e tente novamente.',
        cc_rejected_bad_filled_date: 'A validade informada para o cartão não foi aceita. Confira os dados e tente novamente.',
        cc_rejected_bad_filled_other: 'Algum dado informado do cartão não foi aceito. Confira os dados e tente novamente.',
        cc_rejected_call_for_authorize: 'A compra precisa ser autorizada pelo banco emissor do cartão. Entre em contato com seu banco ou tente outro cartão.',
        cc_rejected_other_reason: 'O cartão não foi aprovado. Tente outro cartão ou outra forma de pagamento.'
      };

      return mensagens[String(statusDetail || '')]
        || 'O pagamento não foi aprovado. Tente outro cartão ou outra forma de pagamento.';
    }

    function limparAcoes() {
      acoes.innerHTML = '';
    }

    function adicionarAcao(textoBotao, href, primaria = false) {
      const link = document.createElement('a');
      link.className = primaria ? 'btn btn-primary' : 'btn';
      link.href = href;
      link.textContent = textoBotao;
      acoes.appendChild(link);
      return link;
    }

    function mostrar(status, orderId, paymentDetail) {
      limparAcoes();

      if (status === 'paid' || status === 'approved') {
        titulo.textContent = 'Pagamento aprovado!';
        texto.textContent = orderId
          ? `Seu pagamento foi aprovado e o pedido ${orderId} foi confirmado com sucesso.`
          : 'Seu pagamento foi aprovado e o pedido foi confirmado com sucesso.';
        adicionarAcao('Continuar comprando', 'produtos.html', true);
        return;
      }

      if (status === 'rejected') {
        titulo.textContent = 'Pagamento não aprovado';
        texto.textContent = mensagemRecusa(paymentDetail?.status_detail);

        const aviso = document.createElement('div');
        aviso.style.cssText = 'margin-top:22px;padding:16px 18px;border:1px solid #e5b8b8;background:#fff7f7;line-height:1.55;';
        aviso.innerHTML = '<strong>O pedido continua salvo.</strong><br>Você pode voltar ao carrinho e escolher outra forma de pagamento. Nenhuma cobrança foi aprovada nesta tentativa.';
        acoes.parentNode.insertBefore(aviso, acoes);

        adicionarAcao('Tentar outro pagamento', 'carrinho.html', true);
        adicionarAcao('Voltar para a loja', 'index.html');
        return;
      }

      if (status === 'cancelled') {
        titulo.textContent = 'Pagamento cancelado';
        texto.textContent = 'O pagamento foi cancelado. Você pode voltar ao carrinho e escolher outra forma de pagamento.';
        adicionarAcao('Voltar ao carrinho', 'carrinho.html', true);
        adicionarAcao('Voltar para a loja', 'index.html');
        return;
      }

      titulo.textContent = 'Pagamento pendente';
      texto.textContent = orderId
        ? `O pedido ${orderId} foi criado e ainda estamos aguardando a confirmação do Mercado Pago.`
        : 'Ainda estamos aguardando a confirmação do Mercado Pago.';
      adicionarAcao('Voltar para a loja', 'index.html', true);
    }

    if (retorno === 'failure' && !id) {
      mostrar('rejected');
      return;
    }

    if (!id) {
      titulo.textContent = 'Não foi possível identificar o pedido';
      texto.textContent = 'Volte para a loja e tente realizar o pagamento novamente.';
      limparAcoes();
      adicionarAcao('Voltar para a loja', 'index.html', true);
      return;
    }

    const tentativas = 30;
    const intervalo = 2000;
    let ultimoStatus = 'pending';
    let ultimoDetalhe = null;

    for (let tentativa = 0; tentativa < tentativas; tentativa++) {
      try {
        const resposta = await fetch('/api/order/' + encodeURIComponent(id) + '?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        });

        if (resposta.ok) {
          const pedido = await resposta.json();
          const status = pedido.payment_status || pedido.status || 'pending';
          const paymentDetail = pedido.payment_detail || null;
          ultimoStatus = status;
          ultimoDetalhe = paymentDetail;

          if (status === 'pending' && retorno === 'success') {
            titulo.textContent = 'Confirmando pagamento…';
            texto.textContent = `Recebemos o retorno do Mercado Pago para o pedido ${id}. Estamos confirmando a aprovação.`;
          } else {
            mostrar(status, pedido.id || id, paymentDetail);
          }

          if (['approved', 'paid', 'rejected', 'cancelled'].includes(status)) return;
        }
      } catch (erro) {
        console.warn('Não foi possível consultar o pedido:', erro);
      }

      if (tentativa < tentativas - 1) {
        await new Promise(resolve => setTimeout(resolve, intervalo));
      }
    }

    if (ultimoStatus === 'pending' && retorno === 'success') {
      titulo.textContent = 'Pagamento em confirmação';
      texto.textContent = `O Mercado Pago retornou com sucesso, mas a confirmação final do pedido ${id} ainda está sendo processada. Atualize esta página em alguns segundos.`;
      limparAcoes();
      adicionarAcao('Voltar para a loja', 'index.html', true);
    } else {
      mostrar(ultimoStatus, id, ultimoDetalhe);
    }
  })();
  </script>
</body>
</html>
