name: Mercado Pago clean check

on:
  push:
    branches:
      - main
      - mercadopago-clean-rebuild
      - mp-official-audit-2026-08-28
      - 'fix/**'
  pull_request:
    branches:
      - main
      - mercadopago-clean-rebuild
  workflow_dispatch:

concurrency:
  group: relogio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node --check startup.js
          node --check startup-migrations.js
          node --check product-data-migrations.js
          node --check catalog-completion-migration.js
          node --check store-health.js
          node --check store-health-bootstrap.js
          node --check admin-store-health.js
          node --check admin-session.js
          node --check admin-security-bootstrap.js
          node --check admin-users-management.js
          node --check persistent-store.js
          node --check accessibility-panel.js
          node --check catalog-intelligence.js
          node --check favorites.js
          node --check favorites-client.js
          node --check admin-favorites.js
          node --check product-page-route.js
          node --check product-page-core.js
          node --check produto.js
          node --check product-compare.js
          node --check product-recommendations.js
          node --check seo-routes.js
          node --check site-search.js
          node --check home-enhancements.js
          node --check mercadopago-core.js
          node --check mercadopago-clean.js
          node --check mercadopago-orders-pix.js
          node --check mercadopago-checkout-client.js
          node --check coupon-checkout.js
          node --check coupon-service.js
          node --check checkout-rate-limit.js
          node --check auth-rate-limit.js
          node --check auth.js
          node --check auth-bootstrap.js
          node --check order-access.js
          node --check inventory-service.js
          node --check confirmation-purchase-service.js
          node --check checkout-confirmation-context.js
          node --check confirmation-payment-completion.js
          node --check remote-image.js
          node --check remote-text.js
          node --check image-proxy.js
          node --check orient-enrichment.js
          node --check resend-client.js
          node --check operational-email-watcher.js
          node --check order-email.js
          node --check invoice-email.js
          node --check invoice-files.js
          node --check admin-invoice-files.js
          node --check shipping-email.js
          node --check order-shipping.js
          node --check admin-order-shipping.js
          node --check order-cancellation-policy.js
          node --check order-cancellation.js
          node --check order-cancellation-email.js
          node --check admin-order-cancellation.js
          node --check return-request-email.js
          node --check account-orders.js
          node --check availability-requests.js
          node --check admin-extra-tabs.js
          node --check catalog-availability.js
          node --check cart-availability.js
          node --check catalog-mobile-filters.js
          node --check product-confirmation-request.js
          node --check customer-address-service.js
          node --check customer-address-routes.js
          node --check customer-addresses.js
          node --check shipping-addresses.js
          node --check shipping-cart.js
          node --check shipping-packaging.js
          node --check shipping-service.js
          node --check shipping-routes.js
          node --check admin-shipping.js
          node --check admin-melhorenvio.js
          node --check admin-photo-order.js
          node --check admin-hide-confirm.js
          node --check catalog-technical-filters.js
          node --check produto-gallery-enhancements.js
          node --check return-requests.js
          node --check admin-returns.js
          node --check return-request-form.js
          node --check legal-footer.js
          node --check casio-enrichment-v2.js
          node --check admin-product-enrichment.js
          node --check admin-stock-catalog.js
          node --check stock-alerts.js

      - name: Run integration tests
        run: npm test

      - name: Check Mercado Pago SDK exports
        run: |
          node - <<'NODE'
          const sdk = require('mercadopago');
          const required = ['MercadoPagoConfig', 'Preference', 'Payment', 'WebhookSignatureValidator'];
          const missing = required.filter(name => !sdk[name]);
          if (missing.length) {
            throw new Error(`Missing Mercado Pago SDK exports: ${missing.join(', ')}`);
          }
          console.log('Mercado Pago SDK exports OK:', required.join(', '));
          NODE
