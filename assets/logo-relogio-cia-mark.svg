<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Relógio e Cia</title>
  <desc id="desc">Quadrado vermelho com um balanço mecânico estilizado em branco.</desc>
  <style>
    .balance { transform-box:view-box; transform-origin:32px 32px; animation:balance-spin 2.4s linear infinite; will-change:transform; }
    @keyframes balance-spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @media (prefers-reduced-motion:reduce){ .balance{animation:none} }
  </style>
  <rect width="64" height="64" rx="1" fill="#e31e24"/>
  <g class="balance" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="21" stroke-width="3.5"/>
    <path d="M32 11v16M53 32H37M32 53V37M11 32h16" stroke-width="3.5"/>
    <circle cx="46.8" cy="17.2" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="46.8" cy="46.8" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="17.2" cy="46.8" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="17.2" cy="17.2" r="2.2" fill="#fff" stroke="none"/>
    <circle cx="32" cy="32" r="6" fill="#e31e24" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="2" fill="#fff" stroke="none"/>
  </g>
</svg>
