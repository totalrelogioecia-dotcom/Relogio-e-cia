<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">Relógio e Cia</title>
  <desc id="desc">Logo Relógio e Cia com balanço mecânico para uso sobre fundos claros ou transparentes.</desc>
  <style>
    .balance { transform-box:view-box; transform-origin:72px 80px; animation:balance-spin 2.4s linear infinite; will-change:transform; }
    @keyframes balance-spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @media (prefers-reduced-motion:reduce){ .balance{animation:none} }
  </style>
  <rect x="16" y="24" width="112" height="112" rx="2" fill="#e31e24"/>
  <g class="balance" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="72" cy="80" r="37" stroke-width="6"/>
    <path d="M72 43v28M109 80H81M72 117V89M35 80h28" stroke-width="6"/>
    <circle cx="98" cy="54" r="4" fill="#fff" stroke="none"/>
    <circle cx="98" cy="106" r="4" fill="#fff" stroke="none"/>
    <circle cx="46" cy="106" r="4" fill="#fff" stroke="none"/>
    <circle cx="46" cy="54" r="4" fill="#fff" stroke="none"/>
    <circle cx="72" cy="80" r="10" fill="#e31e24" stroke-width="6"/>
    <circle cx="72" cy="80" r="3.5" fill="#fff" stroke="none"/>
  </g>
  <text x="158" y="80" fill="#111" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2">Relógio e Cia</text>
  <text x="160" y="111" fill="#6b6d73" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="6">RELOJOARIA DESDE 2003</text>
</svg>
